project_id = "dailylog"

[api]
enabled = true
port = 54321
schemas = ["public", "storage", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[db.seed]
enabled = true
sql_paths = ["./seed.sql", "./seeds/rooms_ratios_demo.sql", "./seeds/enrollment_waitlist_demo.sql", "./seeds/staff_delegations_demo.sql", "./seeds/notifications_group15_demo.sql", "./seeds/children_group20_demo.sql", "./seeds/children_group19_demo.sql", "./seeds/menus_group18_demo.sql", "./seeds/mobile_meal_menu_group11_demo.sql", "./seeds/mobile_staff_visibility_group20_demo.sql", "./seeds/mobile_staff_invite_group21_demo.sql", "./seeds/mobile_time_off_group22_demo.sql", "./seeds/mobile_attendance_group23_demo.sql", "./seeds/mobile_credentials_group24_demo.sql", "./seeds/mobile_parent_group24_demo.sql", "./seeds/mobile_parent_billing_group21_25_demo.sql", "./seeds/mobile_parent_account_group22_demo.sql", "./seeds/mobile_parent_documents_group28_demo.sql", "./seeds/mobile_parent_schedule_group27_demo.sql", "./seeds/mobile_parent_inquiry_group26_demo.sql", "./seeds/mobile_parent_medication_group23_demo.sql", "./seeds/mobile_parent_notifications_demo.sql", "./seeds/mobile_parent_absence_group19_demo.sql", "./seeds/mobile_parent_incidents_group20_demo.sql"]

[studio]
enabled = true
port = 54323

[storage]
enabled = true
file_size_limit = "50MiB"

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000", "dailylog://"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
enable_signup = true

[auth.email]
enable_signup = true
enable_confirmations = false

[functions.dispatch-notifications]
verify_jwt = false

[functions.compliance-inspection-document]
verify_jwt = false # The per-inspection bearer token is checked on every request.
